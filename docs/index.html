<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Biblioteca</title><style>
:root{font-family:system-ui,Segoe UI,sans-serif;color:#18232d;background:#f4f6f3}*{box-sizing:border-box}body{margin:0}.hero{background:#173d35;color:white;padding:40px max(24px,calc((100vw - 960px)/2))}.hero small{letter-spacing:.15em;text-transform:uppercase;color:#b9d8c7}.hero h1{font:500 clamp(2rem,5vw,3.4rem) Georgia,serif;margin:10px 0}.wrap{max-width:960px;margin:24px auto;padding:0 20px;display:grid;grid-template-columns:280px 1fr;gap:20px}.panel,.book{background:white;border:1px solid #e0e6e1;border-radius:14px;padding:18px}label{display:block;font-size:.85rem;margin:12px 0 5px}input{width:100%;padding:10px;border:1px solid #ccd7ce;border-radius:8px;font:inherit}button{border:0;border-radius:8px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer;background:#1d6953;color:white;margin-top:12px;width:100%}.secondary{background:#e8f1ec;color:#245942;margin:0;width:auto}.results{display:flex;flex-direction:column;gap:12px}.results header,.book{display:flex;align-items:center;justify-content:space-between;gap:14px}.book h3{font:500 1.15rem Georgia,serif;margin:0 0 5px}.book p{margin:0;color:#66736b;font-size:.9rem}.count,.isbn{font-size:.8rem;color:#64746b}.error{color:#a33;min-height:1em}@media(max-width:700px){.wrap{grid-template-columns:1fr}}</style></head><body>
<header class="hero"><small>Catalogo personal</small><h1>Biblioteca</h1><p>Organiza tus lecturas y controla los prestamos.</p></header>
<main class="wrap"><form class="panel" id="form"><h2>Anadir un libro</h2><label for="title">Titulo</label><input id="title" required maxlength="100"><label for="author">Autor/a</label><input id="author" required maxlength="80"><label for="isbn">ISBN</label><input id="isbn" required maxlength="30"><button>Anadir al catalogo</button><p id="error" class="error"></p></form><section class="results"><header><h2>Mis libros</h2><span id="count" class="count"></span></header><div id="books"></div></section></main>
<script>
const K='biblioteca-v1',seed=[{title:'El camino de los reyes',author:'Brandon Sanderson',isbn:'978-8417347003',available:true},{title:'La sombra del viento',author:'Carlos Ruiz Zafon',isbn:'978-8408067912',available:false}];let data;try{data=JSON.parse(localStorage.getItem(K))||seed}catch{data=seed}const root=document.querySelector('#books');function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function draw(){document.querySelector('#count').textContent=data.length+' libros';root.innerHTML=data.map((b,i)=>'<article class="book"><div><h3>'+esc(b.title)+'</h3><p>'+esc(b.author)+' - '+(b.available?'Disponible':'Prestado')+'</p><div class="isbn">ISBN '+esc(b.isbn)+'</div></div><button class="secondary" data-i="'+i+'">'+(b.available?'Prestar':'Devolver')+'</button></article>').join('')||'<p>Catalogo vacio</p>';root.querySelectorAll('button').forEach(x=>x.onclick=()=>{data[+x.dataset.i].available=!data[+x.dataset.i].available;save()})}function save(){localStorage.setItem(K,JSON.stringify(data));draw()}document.querySelector('#form').onsubmit=e=>{e.preventDefault();const isbn=document.querySelector('#isbn').value.trim();if(data.some(x=>x.isbn===isbn)){document.querySelector('#error').textContent='ISBN already exists';return}data.unshift({title:document.querySelector('#title').value.trim(),author:document.querySelector('#author').value.trim(),isbn,available:true});e.target.reset();document.querySelector('#error').textContent='';save()};draw();
</script></body></html>
